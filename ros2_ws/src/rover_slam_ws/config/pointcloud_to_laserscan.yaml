pointcloud_to_laserscan_node:
  ros__parameters:
    # Set this to base_link since your lidar driver is already 
    # publishing the cloud in the base_link frame
    target_frame: base_link 
    transform_tolerance: 0.1
    # Increase the height range to be sure we catch everything
    min_height: -0.5 
    max_height: 0.5
    # Use a real number for range_max instead of relying on use_inf
    range_min: 0.1
    range_max: 12.0
    use_inf: true # Change to false to see if real numbers appear